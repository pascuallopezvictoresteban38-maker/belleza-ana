{% extends "base.html" %}
{% block titulo %}Editar producto · Belleza Ana{% endblock %}
{% block contenido %}
<section class="col-lg-6 px-0">
  <h2 class="h4">Editar producto</h2>
  <form method="post" action="{{ url_for('editar', id=alumno._id) }}">
    <div class="mb-3">
      <label for="nombre" class="form-label">Producto</label>
      <input id="nombre" name="nombre" class="form-control"
             value="{{ alumno.nombre }}" required maxlength="80">
    </div>
    <div class="mb-3">
      <label for="categoria" class="form-label">Categoría</label>
      <input id="categoria" name="categoria" class="form-control"
             value="{{ alumno.categoria }}" required maxlength="20">
    </div>
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select id="estado" name="estado" class="form-select" required>
        <option value="">Selecciona</option>
        {% for opcion in ['Disponible', 'Agotado'] %}
        <option value="{{ opcion }}"
          {% if alumno.get('estado') == opcion %}selected{% endif %}>
          {{ opcion }}
        </option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('inicio') }}#lista">Cancelar</a>
  </form>
</section>
{% endblock %}
