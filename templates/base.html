<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Belleza Ana{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">Belleza Ana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menu" aria-controls="menu"
              aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}#registro">Registro</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}#lista">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('ayuda') }}">Ayuda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="container py-4">
    <h1 class="h3 mb-1">Catálogo de productos</h1>
    <p class="text-secondary mb-0">Administra los productos de cuidado personal.</p>
  </header>

  <main class="container pb-5">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="container py-3 border-top text-secondary small">
    Mi proyecto · Belleza Ana
  </footer>

  <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
